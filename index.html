<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>章鱼哥の主页</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="极简主义浏览器起始页 - 快捷方式、搜索与农历" />
  <script>
    (function () {
      try {
        const settings = JSON.parse(localStorage.getItem('astralis_settings') || '{}');
        const theme = settings.theme || 'system';
        const isDark = theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

        document.documentElement.classList.toggle('dark', isDark);
        if (settings.language === 'en' || settings.language === 'zh') {
          document.documentElement.lang = settings.language === 'zh' ? 'zh-CN' : 'en';
        }
        if (typeof settings.customTitle === 'string' && settings.customTitle) {
          document.title = settings.customTitle;
        }
      } catch (e) {
        // If there's an error, do nothing and let React handle it
      }
    })();
  </script>

  <!--
    Tailwind is compiled at build time (see index.css + tailwind.config.js).
    It used to be loaded from cdn.tailwindcss.com, which required network
    access in production, shipped an unpurged runtime JIT compiler, and caused
    the first-paint style flash that the loading screen below existed to hide.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader"></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
